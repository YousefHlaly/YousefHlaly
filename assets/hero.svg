<rect x="60" y="132" width="500" height="2" fill="url(#rule)"/>
<text x="60" y="164" font-size="15" font-weight="600" letter-spacing="3" fill="#67E8F9">AI/ML ENGINEER &#183; DATA SCIENTIST &#183; R&amp;D BUILDER</text>
