<rect y="0" width="220" height="240" fill="url(#scan)">
<animate attributeName="x" values="-240;1000" dur="8s" repeatCount="indefinite"/>
</rect>
<g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" fill="none">
<path d="M700 60 L800 50 M700 60 L800 110 M700 60 L800 170 M700 120 L800 50 M700 120 L800 110 M700 120 L800 170 M700 180 L800 50 M700 180 L800 110 M700 180 L800 170 M800 50 L900 85 M800 50 L900 155 M800 110 L900 85 M800 110 L900 155 M800 170 L900 85 M800 170 L900 155">
<animate attributeName="stroke-opacity" values="0.12;0.35;0.12" dur="5s" repeatCount="indefinite"/>
</path>
</g>
<g filter="url(#glow)">
<circle cx="700" cy="60" r="4.5" fill="#22D3EE"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="120" r="4.5" fill="#22D3EE"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="180" r="4.5" fill="#22D3EE"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="50" r="4.5" fill="#818CF8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="110" r="4.5" fill="#818CF8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="170" r="4.5" fill="#818CF8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="85" r="5.5" fill="#C084FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="155" r="5.5" fill="#C084FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
</g>
<g font-family="Segoe UI, Ubuntu, Helvetica Neue, Helvetica, Arial, sans-serif">
