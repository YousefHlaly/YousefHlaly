<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Yousef Mamdouh - AI/ML Engineer, Data Scientist, R and D Builder">
<title>Yousef Mamdouh - AI/ML Engineer</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#05070E"/>
<stop offset="0.55" stop-color="#0B1026"/>
<stop offset="1" stop-color="#062430"/>
</linearGradient>
<linearGradient id="nameGrad" x1="60" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#22D3EE"/>
<stop offset="0.5" stop-color="#818CF8"/>
<stop offset="1" stop-color="#C084FC"/>
</linearGradient>
<linearGradient id="rule" x1="60" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
